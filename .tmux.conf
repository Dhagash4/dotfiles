# start a non-login shell instead of login shell by default
set -g default-command "${SHELL} -i"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Zen mode: toggle status bar
bind Z set-option status

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# switch panes using Alt-arrow without prefix
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g default-shell /usr/bin/zsh

# Truecolor (RGB) passthrough — fixes wrong colors in btop/nvim themes/bat/etc.
set -g  default-terminal "tmux-256color"
set -ag terminal-features ",*:RGB"

# Productivity
set -sg escape-time 0          # no lag after pressing Esc (matters for vim/nvim)
set -g  history-limit 50000    # bigger scrollback
set -g  renumber-windows on    # keep window numbers contiguous after closing
set -g  focus-events on        # let vim/nvim autoread detect file changes
setw -g mode-keys vi           # vi keys in copy mode

# vi-style copy mode selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# Repeatable pane resize with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# # clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Session save/restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim less more man tail htop btop'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Theme
set -g @plugin 'catppuccin/tmux#latest'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_number_color "#{E:@thm_mauve}"
set -g @catppuccin_icon_window_last "󰖰"
set -g @catppuccin_icon_window_current "󰖯"
set -g @catppuccin_icon_window_zoom "󰁌"
set -g @catppuccin_icon_window_mark "󰃀"
set -g @catppuccin_icon_window_silent "󰂛"
set -g @catppuccin_icon_window_activity "󱅫"
set -g @catppuccin_icon_window_bell "󰂞"
set -g @catppuccin_window_default_text "#W" # use "#W" for application instead of directory
set -g @catppuccin_status_modules_right "cpu date_time"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
