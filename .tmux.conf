# start a non-login shell instead of login shell by default
set -g default-command "${SHELL} -i"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# status bar on/off
bind Z set-option status

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# switch panes using Alt-arrow without prefix
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g default-shell /usr/bin/zsh

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# # clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux half of vim-tmux-navigator (the nvim half is already in init.vim). Without this
# the plugin does nothing: C-h/j/k/l never reaches tmux, so the moment the cursor is in
# the last nvim split it stops moving instead of crossing into the next tmux pane.
set -g @plugin 'christoomey/vim-tmux-navigator'
# The navigator grabs C-h/j/k/l at the root table, so in a *shell* pane those stop being
# zsh's backspace/kill-line/clear and become pane movement. Give clear-screen a home on
# the prefix; S-Left/Right/Up/Down below still move panes if you prefer them.
bind C-l send-keys 'C-l'

# Theme
set -g @plugin 'catppuccin/tmux#latest'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_current_text "none"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_icon_window_last "󰖰"
set -g @catppuccin_icon_window_current "󰖯"
set -g @catppuccin_icon_window_zoom "󰁌"
set -g @catppuccin_icon_window_mark "󰃀"
set -g @catppuccin_icon_window_silent "󰂛"
set -g @catppuccin_icon_window_activity "󱅫"
set -g @catppuccin_icon_window_bell "󰂞"
set -g @catppuccin_window_default_text "#W" # use "#W" for application instead of directory
set -g @catppuccin_status_modules_right "cpu date_time"

# --- What nvim needs from tmux ---------------------------------------------
# tmux-256color (not screen-256color) so nvim sees 256 colours plus italics.
set -g default-terminal "tmux-256color"
# Truecolor passthrough: without Tc, gruvbox-material silently degrades to the nearest
# 256-colour approximation inside tmux while looking correct outside it.
set -ga terminal-overrides ",*256col*:Tc"
# Undercurl (and coloured underlines) for LSP diagnostics, which tmux otherwise flattens
# into a plain underline.
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Let nvim see focus gained/lost, so 'autoread' and CursorHold-based plugins fire when
# you switch panes rather than going stale.
set -g focus-events on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
